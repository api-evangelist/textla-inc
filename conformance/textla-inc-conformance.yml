note: >-
  Textla ships no public API, so every API-shaped standard below is recorded as not-applicable
  or not-conformant on the evidence rather than assumed. The only standards Textla demonstrably
  implements are OAuth 2.0 / OpenID Connect, and only for signing humans in to its own web
  application via an Auth0 tenant on auth.textla.com. Regulatory obligations named in Textla's
  own terms (TCPA, TSR, CAN-SPAM) and the A2P 10DLC / toll-free verification process documented
  in its help center are recorded as claims, not certifications — Textla publishes no audit
  report, no trust center and no certification page.
